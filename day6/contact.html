<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}

body{
background:#f5f5f5;
}

header{
background:#222;
color:white;
text-align:center;
padding:25px;
}

.container{
width:90%;
max-width:700px;
margin:40px auto;
background:white;
padding:30px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
}

h2{
text-align:center;
margin-bottom:20px;
}

label{
display:block;
margin-top:15px;
font-weight:bold;
}

input,
textarea{
width:100%;
padding:12px;
margin-top:8px;
border:1px solid #ccc;
border-radius:5px;
font-size:16px;
}

textarea{
height:150px;
resize:none;
}

button{
margin-top:20px;
width:100%;
padding:14px;
background:#007BFF;
color:white;
border:none;
border-radius:5px;
font-size:17px;
cursor:pointer;
}

button:hover{
background:#0056b3;
}

.info{
margin-top:30px;
text-align:center;
line-height:2;
color:#555;
}

footer{
margin-top:40px;
background:#222;
color:white;
text-align:center;
padding:20px;
}

</style>

</head>

<body>

<header>
<h1>Contact Us</h1>
<p>We'd love to hear from you!</p>
</header>

<div class="container">

<h2>Send a Message</h2>

<form>

<label>Full Name</label>
<input type="text" placeholder="Enter your name" required>

<label>Email Address</label>
<input type="email" placeholder="Enter your email" required>

<label>Phone Number</label>
<input type="tel" placeholder="Enter your phone number">

<label>Message</label>
<textarea placeholder="Write your message..." required></textarea>

<button type="submit">Send Message</button>

</form>

<div class="info">
<p>📍 Dimapur, Nagaland, India</p>
<p>📞 +91 9876543210</p>
<p>📧 info@randomsite.com</p>
</div>

</div>

<footer>
<p>&copy; 2026 RandomSite. All Rights Reserved.</p>
</footer>

</body>
</html>
